# Despliegue en Render (RNF3). El plan gratuito suspende la instancia tras
# 15 minutos sin trafico; el primer acceso posterior tarda ~30 segundos.
services:
  - type: web
    name: sgds
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn "run:app" --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /salud
    envVars:
      - key: ENTORNO
        value: produccion
      - key: SECRET_KEY
        generateValue: true
      # Cifrado del documento y el telefono (RNF5). Se genera una vez y no debe
      # cambiar: los datos cifrados con otra clave no se pueden leer.
      - key: CLAVE_CIFRADO
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.11.9"
      # DATABASE_URL debe apuntar a la base gestionada del piloto.
      - key: DATABASE_URL
        sync: false
      # Opcionales: asistente de voz del conductor y automatizaciones con Make.
      - key: RETELL_API_KEY
        sync: false
      - key: RETELL_AGENTE_CONDUCTOR_ID
        sync: false
      - key: RETELL_AGENTE_GESTOR_ID
        sync: false
      - key: RETELL_AGENTE_ADMIN_ID
        sync: false
      - key: RETELL_AGENTE_CLIENTE_ID
        sync: false
      - key: URL_PUBLICA
        sync: false
      - key: RETELL_VOZ_ID
        sync: false
      # Make: el escenario "SGDS" (avisos de la operacion) y "Rutalytics
      # Privado" (las tres siguientes, con la URL de su webhook).
      - key: MAKE_WEBHOOK_URL
        sync: false
      - key: MAKE_WEBHOOK_RESUMEN_URL
        sync: false
      - key: MAKE_WEBHOOK_CREDENCIALES_URL
        sync: false
      - key: MAKE_WEBHOOK_RESTABLECIMIENTO_URL
        sync: false
      - key: MAKE_WEBHOOK_KEY
        sync: false
      - key: CORREO_OPERACIONES
        sync: false
      # Solo para los endpoints de respaldo; ningun escenario los consulta.
      - key: AUTOMATIZACION_TOKEN
        sync: false

  # OPCIONAL (de pago: Render no tiene plan gratuito para cron). Envia el
  # resumen del dia a Make a las 18:00 de Bogota = 23:00 UTC. Descomentelo para
  # crearlo. Comparte la base, las claves y las variables de Make con la web:
  # CLAVE_CIFRADO y SECRET_KEY deben ser las mismas, por eso salen de ella.
  # - type: cron
  #   name: sgds-resumen-diario
  #   runtime: python
  #   schedule: "0 23 * * *"
  #   buildCommand: pip install -r requirements.txt
  #   startCommand: flask --app run enviar-resumen
